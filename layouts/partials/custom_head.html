<style>
/* Mobile navbar: hide the search icon (kept on desktop) and let the brand
   title fill the freed-up width, left-aligned. Taps pass through empty area. */
@media (max-width: 991.98px) {
  .navbar-nav .nav-link.js-search { display: none !important; }
  .navbar-brand-mobile-wrapper {
    pointer-events: none;
    padding-left: 2.75rem;     /* reserve space for the hamburger */
    padding-right: 2.25rem;    /* right side is now clear of the search icon */
    justify-content: flex-start;
  }
  .navbar-brand-mobile-wrapper .navbar-brand {
    pointer-events: auto;
    margin: 0;                 /* left-align instead of centering */
    display: inline-block;
    white-space: nowrap;
    line-height: 1.2;
    font-size: clamp(0.75rem, 4vw, 1.3rem);   /* fallback before the script runs */
  }
}
</style>
<script>
/* Size the mobile brand title to fill the available width. */
(function () {
  function fitBrand() {
    var wrap = document.querySelector('.navbar-brand-mobile-wrapper');
    if (!wrap || wrap.offsetParent === null) return;
    var brand = wrap.querySelector('.navbar-brand');
    if (!brand) return;
    var cs = getComputedStyle(wrap);
    var avail = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (avail <= 0) return;
    var MAX = 1.4, MIN = 0.6;
    brand.style.fontSize = MAX + 'rem';
    var natural = brand.scrollWidth;
    if (natural > 0) {
      var size = MAX * (avail / natural);
      if (size > MAX) size = MAX;
      if (size < MIN) size = MIN;
      brand.style.fontSize = size + 'rem';
    }
  }
  window.addEventListener('DOMContentLoaded', fitBrand);
  window.addEventListener('load', fitBrand);
  window.addEventListener('resize', fitBrand);
})();
</script>
{{ if and .IsHome (eq .Lang "en") }}
<script>
(function () {
  try {
    if (sessionStorage.getItem('bbl-lang-auto')) return;
    var langs = navigator.languages || [navigator.language || navigator.userLanguage || ''];
    var prefersFrench = langs.some(function (l) {
      return (l || '').toLowerCase().indexOf('fr') === 0;
    });
    if (prefersFrench) {
      sessionStorage.setItem('bbl-lang-auto', '1');
      window.location.replace('fr/');
    }
  } catch (e) {}
})();
</script>
{{ end }}
